name: SonarQube Cloud CFamily

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gardenia-ambika-sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Clang compile-commands + coverage + scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # Fork PRs do not receive id-token: write for OIDC exchange. Skip Sonar
    # analysis rather than using pull_request_target with untrusted code.
    # Compiler and other qualification workflows still run on forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Ninja and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Configure Clang Release with compilation database
        run: |
          cmake -S . -B build/sonar \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGARDENIA_WARNINGS_AS_ERRORS=ON

      - name: Build Clang Release
        run: cmake --build build/sonar --parallel 2

      - name: Run baseline-independent portable tests on Clang build
        run: |
          ctest --test-dir build/sonar --output-on-failure --no-tests=error \
            -R '^(GardeniaCoreMixerTests|GardeniaCoreVoiceOrderingTests|GardeniaCoreJuceScan|GardeniaCoreCompileSmoke|GardeniaCoreCApiSmokeTest|GardeniaCoreAbiLayoutTests|GardeniaCoreAbiInvalidInputTests)$'

      - name: Validate compilation database
        run: |
          python3 scripts/ci/validate-compile-commands.py \
            build/sonar/compile_commands.json \
            --compiler-substr clang \
            --require-std c++17

      - name: Build instrumented coverage and export Sonar XML
        run: bash scripts/ci/run-sonar-coverage.sh

      - name: Authenticate to SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        with:
          project-key: montronedsp_gardenia-ambika-core
          export-env: false

      - name: SonarQube Cloud CFamily scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
          SONAR_REGION: ${{ steps.sonar-auth.outputs.sonar-region }}
        with:
          # Organization/project key also live in sonar-project.properties; pass
          # OIDC-resolved values so the ephemeral token scope matches the scan.
          args: >
            -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }}
            -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json
            -Dsonar.coverageReportPaths=build/coverage/coverage-sonar.xml
