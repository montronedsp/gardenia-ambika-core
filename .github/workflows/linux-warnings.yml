name: GCC and Clang warnings-as-errors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-compiler:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Configure and build all portable targets with Werror
        shell: bash
        env:
          CXX_COMPILER: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          C_COMPILER: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
        run: |
          cmake -S . -B build/strict -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$C_COMPILER" \
            -DCMAKE_CXX_COMPILER="$CXX_COMPILER" \
            -DGARDENIA_WARNINGS_AS_ERRORS=ON
          cmake --build build/strict --parallel 2
      - name: Run baseline-independent portable tests
        shell: bash
        run: |
          ctest --test-dir build/strict --output-on-failure --no-tests=error \
            -R '^(GardeniaCoreMixerTests|GardeniaCoreVoiceOrderingTests|GardeniaCoreJuceScan|GardeniaCoreCompileSmoke|GardeniaCoreCApiSmokeTest|GardeniaCoreAbiLayoutTests|GardeniaCoreAbiInvalidInputTests)$'
