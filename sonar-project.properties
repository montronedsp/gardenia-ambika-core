sonar.projectKey=montronedsp_gardenia-ambika-core
sonar.organization=montronedsp
sonar.host.url=https://sonarcloud.io

sonar.projectName=Gardenia Ambika Core
sonar.sourceEncoding=UTF-8

# First-party production sources. Header-only DSP under include/ and src/dsp/
# is reached through the compiled translation units listed in compile_commands.
sonar.sources=include,src
sonar.tests=tests

# Clang/Ninja Release compilation database generated on the same runner.
sonar.cfamily.compile-commands=build/sonar/compile_commands.json

# gcovr SonarQube Generic Coverage XML from the instrumented GCC build.
sonar.coverageReportPaths=build/coverage/coverage-sonar.xml

# WaveEditWavetableData.h is ~1.9 MB of CC0 numerical bank data. Keep it in
# the source tree for licensing and provenance, but exclude it from coverage
# and duplication metrics so maintainability is not dominated by table bytes.
sonar.coverage.exclusions=**/WaveEditWavetableData.h
sonar.cpd.exclusions=**/WaveEditWavetableData.h
